# 默认 nginx config for CoinStrategy 前端 SPA。
# 如需把 /api/* 反代到 backend 服务，取消下方 location /api/ 注释并填实 backend host。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源缓存（带 hash 的文件名可长缓存）
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：任何未匹配到的路径返回 index.html，让前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === 如需 API 反代，取消下方注释并填实 backend host ===
    # location /api/ {
    #     proxy_pass http://coinstrategy-backend:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 健康端点（与 HEALTHCHECK 配合）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
