# ============================================================
# coin-strategy-job — PROD 生产环境
# 启动方式: --spring.profiles.active=prod
# 说明: web 和 job 部署在同一台服务器，nginx 反代 web (8080)。
#       Priority 5 网络层硬化：job 仅监听 loopback (127.0.0.1)，外部完全不可达。
#       web → job 通过 http://127.0.0.1:8081 (web prod 默认配置)。
#       如未来改成 web/job 跨主机部署，需要：
#         (1) 这里改回 0.0.0.0
#         (2) 服务器防火墙配置仅放行 web 主机 IP 访问 8081
#         (3) 数据库相关敏感信息通过环境变量注入
# ============================================================
server:
  port: 8081
  address: 127.0.0.1

spring:
  datasource:
    # 通过环境变量注入，部署时在服务器 /etc/coinstrategy/smart-wallet.env 中设置
    # DB_HOST / DB_USERNAME / DB_PASSWORD 均不提供代码默认值，必须由运维显式配置。
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:3306/coin_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
