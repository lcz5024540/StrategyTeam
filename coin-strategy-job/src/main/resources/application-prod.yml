# ============================================================
# coin-strategy-job — PROD 生产环境（暂未上线）
# ─────────────────────────────────────────────────────────────
# Prod 环境暂时取消，仅保留模板。当前所有部署都走 test profile。
# 恢复 prod 时请明确:
#   - 部署在哪台机器（test job 占着 49.51.250.174 → prod job 用别的机器或别的端口）
#   - DB 主机（如果与 test 共用一个 MySQL 实例，需要明确不同的 schema 或 user）
#   - server.address 保持 127.0.0.1，job 永远不对外
# ============================================================
server:
  port: 8081
  address: 127.0.0.1

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:3306/coin_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
