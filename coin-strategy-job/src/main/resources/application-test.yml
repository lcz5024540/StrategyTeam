# ============================================================
# coin-strategy-job — TEST 测试环境 (服务器 49.51.250.174)
# 启动方式: --spring.profiles.active=test
# 说明: 测试环境前后端部署在同一台服务器上，后端监听 127.0.0.1
#       由 nginx 反向代理转发请求
# ============================================================
server:
  port: 8081
  address: 127.0.0.1

spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/coin_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

smart-wallet:
  # Keep test on PAPER unless an operator explicitly overrides via environment.
  auto-execution-enabled: false
  polymarket:
    # Test-only discovery override: stop pulling VOLUME leaders because the current
    # candidate pool is dominated by high-frequency, observe-only wallets.
    leaderboard-category: "OVERALL"
    leaderboard-time-period: "ALL"
    leaderboard-order-by: "PNL"
    leaderboard-limit: 100
    leaderboard-queries:
      - category: "OVERALL"
        time-period: "ALL"
        order-by: "PNL"
        limit: 100
    # Expand the scoring pass so test can inspect a larger PnL-only candidate set
    # without loosening any execution or risk gates.
    analyze-top-n: 100
