strategy:
  # Dedicated deployment boundary: Polymarket, SmartWallet and BTC-minute
  # components are excluded during component scanning.
  deployment-mode: FUNDING_ONLY

smart-wallet:
  enabled: false
  scan-enabled: false
  polymarket:
    enabled: false
  execution-wallet:
    enabled: false
    ws-enabled: false

btc-minute:
  enabled: false
  mode: OFF

arbitrage:
  multi-exchange:
    scan-enabled: true
    monitor-enabled: true
    settlement-enabled: true
    contract-sync-enabled: true
    # 合约元数据低频变更；目录使用内存缓存，定时刷新以发现上架/下架。
    contract-sync-delay-ms: 43200000
    # 以可成交买卖价而非 Mark Price 限制跨所 basis；收益须覆盖一次开平成本的 1.25 倍。
    max-executable-basis: 0.003
    minimum-cost-coverage-ratio: 1.25
    health-check-enabled: true
    recovery-enabled: true
    # Paper 观测以 cross_exchange_arb_opportunity 数据库记录为准；关闭本地 CSV replay 文件采集。
    capture-enabled: false
    capture-symbols: "BTCUSDT,ETHUSDT,SOLUSDT"
    capture-delay-ms: 30000
    capture-order-book-depth: 100
    # L2 sizing shrinks the paper order to the common executable base quantity on both legs;
    # minimum-notional and VWAP impact are the hard liquidity gates.
    minimum-order-book-notional: 300
    minimum-order-book-coverage-ratio: 1.5
    maximum-leg-vwap-impact: 0.0005
    paper-capital-per-exchange: 2000
    # 首轮 OKX/Bitget Paper 对齐逐仓 5x；每腿名义限制 2,000U，真实下单仍硬禁用。
    maximum-paper-leverage: 5
    max-symbol-notional: 2000
    max-exchange-notional: 2000
    auto-paper-open-enabled: true
    # 0 means use the approved opportunity's full executable notional after pre-trade revalidation.
    auto-paper-open-notional: 0
    auto-paper-open-max-per-cycle: 1
    # Persist Paper PnL snapshots into cross_exchange_risk_snapshot for the 7-day observation window.
    paper-pnl-snapshot-enabled: true
    paper-pnl-snapshot-window-days: 7
    paper-pnl-snapshot-delay-ms: 60000
    maintenance-margin-rate: 0.005
    minimum-liquidation-distance: 0.15
    unknown-symbol-liquidation-distance: 0.30
    maximum-liquidation-distance: 0.40
    volatility-multiplier: 4
    jump-multiplier: 3
    minimum-risk-history-ms: 3600000
