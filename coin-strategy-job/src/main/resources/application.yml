server:
  # [FIXED-ONCE] Local service port. Usually set once per machine.
  port: 8081
  servlet:
    context-path: /strategy/api

spring:
  profiles:
    # 默认激活 local 环境；部署时通过 --spring.profiles.active=test/prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}

springdoc:
  # [FIXED-ONCE] Swagger UI entry path for local API inspection.
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

  # datasource 配置已移至各环境 profile 文件:
  # application-local.yml / application-test.yml / application-prod.yml

sunwk:
  api:
    base-url: "https://api.sunwk.com"
    api-key: "${SUNWK_API_KEY:}"
    secret-key: "${SUNWK_SECRET_KEY:}"

binance:
  api:
    api-key: "${BINANCE_API_KEY:}"
    secret-key: "${BINANCE_SECRET_KEY:}"
    spot-url: "https://api.binance.com"
    futures-url: "https://fapi.binance.com"
    proxy-host: "127.0.0.1"
    proxy-port: 7897
    proxy-type: HTTP

arbitrage:
  spot-futures:
    # [TUNE] 单交易所期现套利策略的主交易对。
    symbol: "BTCUSDT"
    # [TUNE] 单次开仓使用的现货侧预算金额（USDT），杠杆应用前的基准资金。
    trade-usdt-amount: 100
    # [TUNE] 对冲用合约空单的杠杆倍数。建议保持在 1x-3x 区间；
    # 更高杠杆虽然能提高资金利用率，但会明显放大保证金恶化和强平风险。
    leverage: 3
    # [TUNE] 允许新开对冲仓位的最低当前资金费率阈值。
    open-threshold: 0.0005
    # [TUNE] 当前资金费率低于该值时触发平仓，表示继续持有的收益吸引力不足。
    close-threshold: 0.0001
    # [TUNE] 可接受的最小基差率，即 (合约价格 - 现货价格) / 现货价格 的下限。
    min-basis-rate: 0.0000
    # [TUNE] 可接受的最大基差率上限，用于避免追逐过高的合约升水。
    max-basis-rate: 0.0030
    # [TUNE] 开仓后允许承受的最大不利基差走阔幅度，超过则触发防守性退出。
    max-basis-deterioration-rate: 0.0015
    # [TUNE] 预估现货和合约双边开平仓的总手续费率，用于净收益过滤。
    estimated-round-trip-fee-rate: 0.0010
    # [TUNE] 组合滑点容忍阈值；开仓时若 depth 盘口可用，系统会按逐档 VWAP 估算现货与合约侧的组合滑点率。
    # 若深度连续重试失败，开仓会直接拒绝；平仓只记录流动性告警，不阻塞退出。
    estimated-slippage-rate: 0.0005
    # [TUNE] 是否启用基于现货/合约 depth 盘口的深度与滑点风控。
    liquidity-check-enabled: true
    # [TUNE] 获取 depth 盘口失败时的快速重试次数；开仓重试耗尽后直接拒绝，平仓重试耗尽后仅告警放行。
    liquidity-retry-count: 3
    # [TUNE] 单次盘口重试之间的等待时间（毫秒）。
    liquidity-retry-interval-millis: 200
    # [TUNE] 估算预期资金费收益时默认至少持有的资金费结算期数。
    min-funding-periods: 4
    # [TUNE] 扣除预估手续费和滑点后的最低预期净收益率，低于该值不允许开仓。
    min-net-yield-rate: 0.0002
    # [TUNE] 距离下一次资金费结算不足该分钟数时，不允许新开仓。
    settlement-protection-window-minutes: 5
    # [TUNE] 单个策略仓位允许的现货侧最大名义价值上限（USDT）。
    max-position-value-usdt: 1000
    # [TUNE] 允许新开仓时，合约账户可接受的最低保证金率。
    min-margin-ratio: 2.0
    # [TUNE] 开仓前对合约所需初始保证金施加的安全缓冲倍数。
    required-margin-buffer-rate: 1.10
    # [TUNE] 持仓期间合约保证金率的紧急退出阈值，低于该值时应优先平仓。
    emergency-close-margin-ratio: 1.80
    # [TUNE] 历史兼容配置。当前实现中，平仓阶段的流动性评估只做告警，不再阻塞执行。
    emergency-close-liquidity-override-enabled: true
    # [TUNE] 是否启用“现货账户 -> U 本位合约账户”的自动再平衡划转。
    rebalance-enabled: true
    # [TUNE] 当合约保证金率低于该值时，触发自动补充合约保证金。
    rebalance-threshold-margin-ratio: 1.5
    # [TUNE] 自动划转后的目标保证金率；系统会按该目标反推所需划转金额。
    rebalance-target-margin-ratio: 3.0
    # [TUNE] 自动再平衡默认划转的资产，当前单交易所策略默认使用 USDT。
    rebalance-asset: "USDT"

smart-wallet:
  # [FIXED-ONCE] Master switch for this module.
  enabled: true
  # [TUNE] Enable only after paper flow and accounting are verified.
  auto-execution-enabled: false
  # [FIXED-ONCE] Toggle periodic scan/processing jobs.
  scan-enabled: true
  # [TUNE] Keep true if category/tag matching should remain part of qualification.
  require-tag-match: true
  # [TUNE] Wallet admission threshold for watchlist qualification.
  min-win-rate: 0.62
  # [TUNE] Wallet scoring threshold for watchlist qualification.
  min-wallet-score: 0.70
  # [TUNE] Minimum sample size required before trusting a wallet.
  min-total-trades: 25
  # [TUNE] Minimum realized PnL used to filter weak wallets.
  min-realized-pnl-usdc: 1000
  # [TUNE] Maximum tolerated drawdown for watchlist qualification.
  max-drawdown-rate: 0.25
  # [TUNE] Enable recent-degradation observe cooldown instead of immediately dropping profile qualification.
  observe-cooldown-enabled: true
  observe-cooldown-min-recent-trades-7d: 6
  observe-cooldown-low-recent-win-rate-7d: 0.45
  observe-cooldown-max-recent30d-gap: 0.20
  observe-cooldown-max-historical7d-gap: 0.25
  observe-cooldown-recover-min-recent-win-rate-7d: 0.55
  observe-cooldown-recover-max-recent30d-gap: 0.10
  observe-cooldown-days: 7
  # [TUNE] Ignore very illiquid markets.
  min-market-liquidity: 25000
  # [TUNE] Global cap for a single recommended stake.
  max-stake-usdc: 150
  # [TUNE] Fraction of bankroll allowed per trade before caps. (0.03→0.05 提升单笔仓位防止跌破min-order)
  bankroll-utilization-rate: 0.05
  # [TUNE] Delay between observed smart-wallet event and follow attempt.
  follow-delay-seconds: 3
  # [FIXED-ONCE] Background polling cadence for follow-task processing.
  poll-fixed-delay-ms: 5000
  polymarket:
    # [FIXED-ONCE] Enable Polymarket integration.
    enabled: true
    # [FIXED-ONCE] Auto-discovery can stay off if discovery is triggered manually.
    auto-discover-enabled: true
    # [FIXED-ONCE] Periodically sync fresh trades for watchlist wallets.
    auto-sync-events-enabled: true
    # [FIXED-ONCE] Official Polymarket Data API base URL.
    data-api-base-url: "https://data-api.polymarket.com"
    # [FIXED-ONCE] Official Polymarket Gamma API base URL.
    gamma-api-base-url: "https://gamma-api.polymarket.com"
    # [TUNE] Leaderboard source filters for wallet discovery.
    leaderboard-category: "OVERALL"
    leaderboard-time-period: "ALL"
    leaderboard-order-by: "PNL"
    # [TUNE] Candidate pool size before deeper analysis.
    leaderboard-limit: 50
    leaderboard-queries:
      - category: "OVERALL"
        time-period: "ALL"
        order-by: "PNL"
        limit: 50
      - category: "OVERALL"
        time-period: "ALL"
        order-by: "VOLUME"
        limit: 50
    # [TUNE] Number of top wallets to score each cycle.
    analyze-top-n: 30
    # [TUNE] Historical closed positions fetched per wallet.
    closed-position-limit: 50
    # [TUNE] Recent trades fetched per watchlist wallet.
    recent-trade-limit: 30
    # [TUNE] Recent trades fetched during discovery for session-profile enrichment.
    discovery-profile-trade-limit: 30
    # [TUNE] Lookback window used by discovery session coverage diagnostics.
    session-coverage-lookback-days: 30
    # [FIXED-ONCE] Discovery job interval.
    discovery-fixed-delay-ms: 3600000
    # [FIXED-ONCE] Incremental leaderboard refresh should not churn the HOT watchlist every few minutes.
    leaderboard-refresh-fixed-delay-ms: 1800000
    # [TUNE] Use the same per-query coverage as the main leaderboard pool during incremental refresh.
    leaderboard-refresh-top-n: 50
    # [FIXED-ONCE] Watchlist trade sync interval. (60s→30s 加快信号发现)
    event-sync-fixed-delay-ms: 30000
    # [TUNE] Balance/positions sync cadence for the configured live execution wallet.
    position-sync-fixed-delay-ms: 15000
    # [TUNE] Cooldown after transient live wallet sync failures.
    position-sync-error-cooldown-ms: 300000
    # [TUNE] Longer cooldown after Polymarket returns 404 for the configured live wallet address.
    position-sync-not-found-cooldown-ms: 1800000
    # [TUNE] Background cadence for collecting recent active market snapshots.
    market-snapshot-fixed-delay-ms: 45000
    # [TUNE] Background cadence for backfilling recent trade effect labels.
    trade-effect-label-fixed-delay-ms: 60000
    # [TUNE] Background cadence for building wallet_feature_daily snapshots.
    wallet-feature-daily-fixed-delay-ms: 300000
    # [TUNE] Internal follow-result feedback loop cadence. Lower than 6h so heavy-loss leaders can be downgraded the same day.
    internal-win-rate-refresh-fixed-delay-ms: 900000
    # [TUNE] Sync only a small batch of watchlist wallets each round to avoid bursty API traffic. (3→5 减少轮询周期)
    watchlist-trade-sync-batch-size: 5
    # [TUNE] Minimum spacing between two trade-sync requests for the same wallet. (120s→60s 更快检测新交易)
    wallet-trade-sync-min-interval-ms: 60000
    # [TUNE] Back off longer after one wallet hits a network/TLS failure.
    wallet-trade-error-cooldown-ms: 300000
    # [FIXED-ONCE] Background cadence for refreshing WARM-tier wallet metrics.
    warm-metrics-refresh-fixed-delay-ms: 600000
    # [TUNE] Refresh only part of the WARM pool each round to avoid bursty profile recomputation.
    warm-metrics-refresh-batch-size: 10
    # [TUNE] Minimum spacing between two WARM-tier profile refreshes for the same wallet.
    warm-wallet-refresh-min-interval-ms: 1800000
    # [TUNE] Keep existing HOT wallets during small score/win-rate drift instead of dropping them immediately.
    hot-retention-enabled: true
    hot-retention-hours: 72
    score-hysteresis-buffer: 0.12
    win-rate-hysteresis-buffer: 0.06
    # [TUNE] Wallets with no observed trade for this many days are moved to WARM, then COLD after the cold threshold.
    warm-wallet-inactivity-days: 30
    cold-wallet-inactivity-days: 60
  execution-wallet:
    # [SCRIPT][FIXED-ONCE] Live routing master switch. Requires env secrets to be present.
    enabled: true
    # [FIXED-ONCE] Polymarket execution network.
    chain: "polygon"
    chain-id: 137
    # [SCRIPT][FIXED-ONCE] Wallet address injected from local env script.
    address: "${POLYMARKET_EXECUTION_WALLET_ADDRESS:}"
    # [SCRIPT][FIXED-ONCE] Private key injected from local env script.
    private-key: "${POLYMARKET_EXECUTION_PRIVATE_KEY:}"
    # [SCRIPT][FIXED-ONCE] Funder address injected from local env script.
    funder-address: "${POLYMARKET_EXECUTION_FUNDER_ADDRESS:}"
    # [TUNE] Hard ceiling for one live order.
    max-order-usdc: 30
    # [TUNE] Reject tiny orders below this size.
    min-order-usdc: 1
    # [TUNE] Price buffer used when preparing orders.
    price-slippage-rate: 0.02
    # [TUNE] Default single-side fee-rate assumption used by offline paper EV labels.
    estimated-fee-rate: 0.0015
    # [TUNE] Side-level execution filters.
    allow-yes: true
    allow-no: true
    # [FIXED-ONCE] Official CLOB API base URL.
    api-base-url: "https://clob.polymarket.com"
    # [SCRIPT][FIXED-ONCE] Derived CLOB API credentials injected from local env script.
    api-key: "${POLYMARKET_CLOB_API_KEY:}"
    api-secret: "${POLYMARKET_CLOB_API_SECRET:}"
    api-passphrase: "${POLYMARKET_CLOB_API_PASSPHRASE:}"
    # [FIXED-ONCE] Market data prefers websocket to avoid REST rate pressure.
    ws-enabled: true
    ws-url: "wss://ws.polymarket.com"
    # [TUNE] Treat WS orderbook/price cache as stale after this long.
    ws-cache-ttl-ms: 30000
    # [TUNE] Initial wait window for the first WS snapshot before REST fallback.
    ws-warmup-wait-ms: 1200
    # [TUNE] Periodic websocket diagnostics log cadence.
    ws-diagnostics-fixed-delay-ms: 120000
    # [FIXED-ONCE] Allow wallet-based derivation if API creds are not yet stored.
    derive-api-creds-if-missing: true
    # [FIXED-ONCE] Current bridge uses the official Python SDK.
    sdk-mode: "JAVA"
    # [SCRIPT][FIXED-ONCE] Python interpreter used by the CLOB bridge.
    python-executable: "${POLYMARKET_PYTHON_EXECUTABLE:/opt/homebrew/bin/python3.11}"
    # [FIXED-ONCE] Local helper script path.
    helper-script-path: "scripts/polymarket_clob_client.py"
    # [TUNE] Maximum wait for one Python SDK bridge call before treating it as an external execution failure.
    python-timeout-seconds: 45
    # [FIXED-ONCE] Polymarket signature mode and default order type.
    signature-type: 0
    order-type: "GTC"
  signal-risk:
    # [TUNE] Keep SELL disabled unless you explicitly want reverse / exit following.
    allow-sell-signal: false
    # [TUNE] Optional automatic stop-loss automation for open positions.
    enable-auto-stop-loss: true
    # [TUNE] Trigger automatic stop-loss once unrealized ROI <= -threshold.
    auto-stop-loss-threshold-rate: 0.35
    # [TUNE] Optional automatic take-profit automation for open positions.
    # When current unrealized ROI reaches this threshold, the position exits
    # early so gains are locked in and capital can be recycled immediately.
    enable-auto-take-profit: true
    # [TUNE] Trigger automatic take-profit once unrealized ROI >= this threshold.
    auto-take-profit-threshold-rate: 0.60
    fast-event-max-hours: 24
    long-horizon-stake-multiplier: 0.50
    # [TUNE] Main freshness gate. Keep LIVE/PAPER consistent and tolerate test sync latency.
    max-signal-age-seconds: 3600
    # [TUNE] Ignore tiny smart-wallet prints.
    min-trigger-size-usdc: 5
    # [TUNE] Follow only inside this market price band.
    min-follow-price: 0.02
    max-follow-price: 0.98
    # [TUNE] When enabled, reject signals whose local historical net EV estimate is below threshold.
    enable-ev-gate: true
    # [TUNE] Minimum local label sample size before EV gate is trusted.
    ev-min-sample-size: 3
    # [TUNE] Minimum expected net EV required when EV gate is enabled.
    min-expected-net-ev-usdc: 0.50
    # [TUNE] Optional probability gate driven by calibrated baseline model output.
    enable-probability-gate: true
    min-calibrated-follow-probability: 0.52
    # [TUNE] Optional slippage gate driven by predicted execution risk. (true→false 灰度关闭，观察对胜率影响)
    enable-slippage-gate: false
    max-expected-slippage-usdc: 1.00
    max-slippage-spike-probability: 0.55
    # [TUNE] Maximum number of simultaneously open positions across the portfolio.
    max-open-positions: 20
    # [TUNE] Portfolio-wide capital budget for still-open positions.
    max-total-open-cost-usdc: 500
    # [FIX-MARKET-TIMING] Polymarket prediction markets typically run for weeks/months.
    # 72h was excluding virtually all active markets. 720h (30 days) allows meaningful participation
    # while still filtering truly long-dated events that would tie up capital.
    # Raised to 180d because recent Polymarket copy candidates are sports/politics futures,
    # and the previous 30d window left the strategy with no executable sample.
    max-hours-to-market-end: 4320
    # [TUNE] Do not open another position if the same market+outcome is already open.
    block-duplicate-open-position: true
    # [TUNE] Do not queue another pending task if the same market+outcome is already pending.
    block-duplicate-pending-task: true
    # [TUNE] Strong safety rail: block opening the opposite side on the same market.
    block-opposite-open-position-same-market: true
    # [TUNE] Strong safety rail: block pending tasks that would open the opposite side on the same market.
    block-opposite-pending-task-same-market: true
    # [TUNE] Multi-wallet consensus gate for stricter entry.
    enable-consensus-gate: true
    policy-tag: "candidate-v2"
    entry-strategy-route-mode: ANY
    enabled-entry-strategies:
      - CONSENSUS
      - HIGH_QUALITY_SINGLE_WALLET
      - SINGLE_WALLET_PAPER_CANARY
    # [FIX-CONSENSUS-WINDOW] Root cause of zero-position deadlock.
    # Smart wallets react to the same market signal over minutes to hours, not within 3 minutes.
    # With watchlist-trade-sync-batch-size=3 and many wallets, even the sync rotation alone
    # takes >180s. Increased to 3600s (1h) so multi-wallet consensus is actually detectable.
    consensus-window-seconds: 3600
    # [TUNE] Minimum distinct entities (after wallet deduplication) before consensus is trusted.
    # Keep LIVE/PAPER on the same loosened gate so single high-quality wallets can open.
    min-distinct-wallets: 1
    min-distinct-entities: 1
    # [TUNE] Loosened from 0.65 to unblock low-but-nonzero single-entity consensus.
    min-consensus-score: 0.20
    quality-weighted-consensus-enabled: true
    consensus-entity-base-weight: 0.60
    consensus-behavior-weight: 0.15
    consensus-recency-weight: 0.10
    consensus-leader-follower-weight: 0.05
    consensus-independence-weight: 0.05
    consensus-recent-consistency-weight: 0.05
    # [TUNE] Special strategy lane for one exceptional wallet.
    enable-single-wallet-override: true
    enable-single-wallet-override-canary: true
    single-wallet-override-canary-rate: 0.10
    # [FIX-BIAS-GUARD] Survivorship bias guard: only flag wallets with winRate=1.0 AND
    # ≤20 trades as suspicious. Raising the sample-size threshold from 50→20 breaks the
    # structural deadlock: previously a wallet with ≥50 trades AND winRate=1.0 was blocked
    # by the guard, while a wallet with <50 trades was blocked by min-trades. Now wallets
    # with 20-50 trades and a genuine (non-perfect) win rate can qualify for override.
    block-unreliable-leaderboard-win-rate: true
    unreliable-win-rate-threshold: 1.0
    unreliable-max-sample-size: 20
    single-wallet-override-min-wallet-score: 0.75
    single-wallet-override-min-win-rate: 0.68
    single-wallet-override-min-trades: 30
    single-wallet-override-min-recent-trades-7d: 1
    single-wallet-override-min-recent-win-rate-7d: 0.60
    single-wallet-override-min-replicability-score: 0.60
    single-wallet-override-min-quality-score: 0.60
    single-wallet-override-min-trigger-size-usdc: 15
    single-wallet-override-min-recommended-stake-usdc: 1
    # [PAPER-CANARY] Controlled trial lane for HOT watch-enabled wallets when consensus/archetype layers are too strict.
    # FollowTaskService forces this lane to PAPER even if global auto execution is later enabled.
    enable-single-wallet-paper-canary: true
    paper-canary-min-wallet-score: 0.70
    paper-canary-min-trigger-size-usdc: 100
    paper-canary-min-follow-probability: 0.70
    paper-canary-stake-usdc: 1.00
    paper-canary-max-signal-age-seconds: 10800
    scale-up-max-market-outcome-cost-usdc: 30
    # ── 持仓集中度门控（防控盘）────────────────────────────────────────
    # [FEATURE] 集中度门控总开关。先以 DOWNSIZE 方式灰度，而不是直接 BLOCK。
    enable-concentration-gate: true
    extreme-concentration-mode: DOWNSIZE
    extreme-concentration-downsize-rate: 0.50
    concentration-high-risk-mode: DOWNSIZE
    concentration-high-risk-downsize-rate: 0.50
    # [TUNE] 极端集中阈值。命中时默认直接拒单，而不是只缩仓。
    max-top1-extreme-concentration-pct: 0.70
    max-top3-extreme-concentration-pct: 0.90
    max-top5-extreme-concentration-pct: 0.95
    extreme-concentration-max-observed-holders: 10
    max-extreme-hhi: 6000
    # [TUNE] CR_1 上限：单一持仓者占比超过此值拒绝信号
    max-top1-concentration-pct: 0.40
    # [TUNE] CR_3 上限：前三持仓者合计占比超过此值拒绝信号
    max-top3-concentration-pct: 0.65
    # [TUNE] HHI 上限（0=禁用）
    max-hhi: 2500
    # [TUNE] 鲸鱼信号来源处置模式：BLOCK / DOWNSIZE / WARN_ONLY
    whale-signal-source-mode: DOWNSIZE
    # [TUNE] DOWNSIZE 模式下仓位保留比例
    whale-signal-downsize-rate: 0.40
    # [TUNE] 集中度缓存有效期（ms）
    concentration-cache-ttl-ms: 60000
    # [TUNE] 拉取前 N 名持仓人
    concentration-top-n: 50
    # [TUNE] 样本过小时只提示不拦截，避免 top-N/单方向持仓数据把普通市场误判为控盘。
    concentration-min-observed-holders-for-gate: 12
    # [TUNE] CR_3 低于此值不施加仓位惩罚
    concentration-stake-safe-top3-pct: 0.40
    # [TUNE] 集中度惩罚最大削减比例
    concentration-stake-penalty-max-rate: 0.50
    # ── Kelly 动态仓位 ─────────────────────────────────────────
    # [TUNE] 启用后使用 calibratedFollowProbability 和入场价格计算 Kelly 仓位
    kelly-stake-enabled: true
    # [TUNE] Kelly 折扣因子，0.3 = 保守半 Kelly 以下
    kelly-fraction: 0.30
    stake-stability-low-score: 0.45
    stake-stability-low-multiplier: 0.70
    stake-stability-high-score: 0.75
    stake-stability-high-multiplier: 1.05
    stake-slippage-penalty-start-rate: 0.04
    stake-penalty-floor-multiplier: 0.55
    stake-theme-correlation-penalty-multiplier: 0.75
    # ── 时间感知止损 ──────────────────────────────────────────
    # [TUNE] 启用后按市场剩余时间动态收紧止损线
    time-aware-stop-loss-enabled: true
    # [TUNE] 止损分段（remainingHours 降序排列，matches first tier where remaining <= remainingHours）
    stop-loss-tiers:
      - remaining-hours: 168
        threshold-rate: 0.35
      - remaining-hours: 24
        threshold-rate: 0.25
      - remaining-hours: 6
        threshold-rate: 0.15
      - remaining-hours: 0
        threshold-rate: 0.05
    # [TUNE] 启用趋势加速止损
    trend-stop-loss-enabled: true
    # [TUNE] 连续多少个扫描周期（约 5 分钟/周期）价格单调下跌且 ROI<0 时触发
    trend-stop-loss-consecutive-periods: 3
    # [METHOD-C] 退出信号提供者模式: RULES=时间感知止损; SCORING=特征评分退出
    exit-signal-provider-mode: SCORING
    exit-scoring-roi-momentum-weight: 0.10
    exit-scoring-consensus-decay-weight: 0.30
    exit-scoring-orderbook-deterioration-weight: 0.25
    exit-scoring-high-concentration-weight: 0.20
