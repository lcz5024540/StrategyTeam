# ============================================================
# coin-strategy-job — LOCAL 本地开发环境
# 启动方式: --spring.profiles.active=local
#
# 数据库密码通过环境变量注入，不允许明文写入此文件。
# 本地开发请在启动前执行:
#   source scripts/local-dev.env   (从 scripts/local-dev.env.example 复制后填写)
# 或在 IntelliJ Run Configuration 的 Environment variables 中设置 DB_PASSWORD。
# ============================================================
server:
  port: 8081
  address: 127.0.0.1

spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/coin_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "root"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
