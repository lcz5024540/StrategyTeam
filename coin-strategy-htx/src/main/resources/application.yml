    profit-cooldown-ms: ${HTX_TREND_PROFIT_COOLDOWN_MS:900000}
    profit-cooldown-min-net-profit-usdt: ${HTX_TREND_PROFIT_COOLDOWN_MIN_NET_PROFIT_USDT:1.00}
    profit-cooldown-strong-reentry-after-ms: ${HTX_TREND_PROFIT_COOLDOWN_STRONG_REENTRY_AFTER_MS:600000}
    profit-cooldown-strong-reentry-min-adx: ${HTX_TREND_PROFIT_COOLDOWN_STRONG_REENTRY_MIN_ADX:30}
    profit-cooldown-strong-reentry-min-atr-pct: ${HTX_TREND_PROFIT_COOLDOWN_STRONG_REENTRY_MIN_ATR_PCT:0.0020}
    client-order-id-prefix: ${HTX_TREND_CLIENT_ORDER_ID_PREFIX:CSTF}
    mirror:
      enabled: ${HTX_TREND_MIRROR_ENABLED:false}
      account-label: ${HTX_TREND_MIRROR_ACCOUNT_LABEL:TradeX}
      access-key: ${HTX_TREND_MIRROR_ACCESS_KEY:}
      secret-key: ${HTX_TREND_MIRROR_SECRET_KEY:}
      base-url: ${HTX_TREND_MIRROR_BASE_URL:https://api.hbdm.com}
      sync-leverage: ${HTX_TREND_MIRROR_SYNC_LEVERAGE:true}
      block-entry-on-leverage-sync-failure: ${HTX_TREND_MIRROR_BLOCK_ENTRY_ON_LEVERAGE_SYNC_FAILURE:false}
      block-primary-close-until-synced: ${HTX_TREND_MIRROR_BLOCK_PRIMARY_CLOSE_UNTIL_SYNCED:true}
    ensemble-shadow:
      enabled: ${HTX_TREND_ENSEMBLE_SHADOW_ENABLED:false}
      contract-codes: ${HTX_TREND_ENSEMBLE_CONTRACTS:BTC-USDT,ETH-USDT,XAUT-USDT}
      periods: ${HTX_TREND_ENSEMBLE_PERIODS:15min,30min,60min,4hour}
      kline-size: ${HTX_TREND_ENSEMBLE_KLINE_SIZE:180}
      candle-close-grace-seconds: ${HTX_TREND_ENSEMBLE_CANDLE_CLOSE_GRACE_SECONDS:10}
      fast-ema-period: ${HTX_TREND_ENSEMBLE_FAST_EMA_PERIOD:20}
      medium-ema-period: ${HTX_TREND_ENSEMBLE_MEDIUM_EMA_PERIOD:60}
      slow-ema-period: ${HTX_TREND_ENSEMBLE_SLOW_EMA_PERIOD:120}
      breakout-lookback: ${HTX_TREND_ENSEMBLE_BREAKOUT_LOOKBACK:20}
      momentum-lookback: ${HTX_TREND_ENSEMBLE_MOMENTUM_LOOKBACK:12}
      atr-period: ${HTX_TREND_ENSEMBLE_ATR_PERIOD:14}
      adx-period: ${HTX_TREND_ENSEMBLE_ADX_PERIOD:14}
      volume-lookback: ${HTX_TREND_ENSEMBLE_VOLUME_LOOKBACK:20}
      min-atr-pct: ${HTX_TREND_ENSEMBLE_MIN_ATR_PCT:0.0010}
      min-adx: ${HTX_TREND_ENSEMBLE_MIN_ADX:16}
      min-momentum-pct: ${HTX_TREND_ENSEMBLE_MIN_MOMENTUM_PCT:0.0015}
      min-volume-ratio: ${HTX_TREND_ENSEMBLE_MIN_VOLUME_RATIO:1.10}
      entry-score-threshold: ${HTX_TREND_ENSEMBLE_ENTRY_SCORE_THRESHOLD:60}
      min-score-gap: ${HTX_TREND_ENSEMBLE_MIN_SCORE_GAP:12}
      poll-interval-ms: ${HTX_TREND_ENSEMBLE_POLL_INTERVAL_MS:60000}
      initial-delay-ms: ${HTX_TREND_ENSEMBLE_INITIAL_DELAY_MS:45000}
      model-version: ${HTX_TREND_ENSEMBLE_MODEL_VERSION:ensemble-shadow-v1}

  contract:
    # USDT 本位永续合约模式。默认整模块关闭；启用后仍默认 dry-run。
    enabled: ${HTX_CONTRACT_ENABLED:false}
    dry-run: ${HTX_CONTRACT_DRY_RUN:true}
    # 实盘要求三门同时满足：enabled=true、dry-run=false、live-enabled=true。
    live-enabled: ${HTX_CONTRACT_LIVE_ENABLED:false}
    base-url: ${HTX_CONTRACT_BASE_URL:https://api.hbdm.com}
    margin-mode: isolated
    position-mode: dual_side
    contract-codes: ${HTX_CONTRACT_CODES:XAUT-USDT}
    leverage: ${HTX_CONTRACT_LEVERAGE:5}
    max-leverage: ${HTX_CONTRACT_MAX_LEVERAGE:5}
    depth-step: 6
    depth-top-n: 10
    depth-safety-ratio: 3.0
    min-quote-notional: ${HTX_CONTRACT_MIN_NOTIONAL:5}
    max-single-quote-notional: ${HTX_CONTRACT_MAX_SINGLE_NOTIONAL:1100}
    margin-safety-ratio: 1.20
    fill-poll-interval-ms: 500
    fill-timeout-ms: 10000
    query-failure-threshold: 5
    uid-query-limit: ${HTX_CONTRACT_UID_QUERY_LIMIT:68}
    uid-trade-limit: ${HTX_CONTRACT_UID_TRADE_LIMIT:68}
    uid-rate-window-ms: ${HTX_CONTRACT_UID_RATE_WINDOW_MS:3000}
    # Moving-grid hedge/recycle supervisor. Default off; when enabled, it can plan durable hedge
    # intents from spot inventory and reconcile SENT rows. Shadow mode never submits pending intents.
    hedge-supervisor-enabled: ${HTX_CONTRACT_HEDGE_SUPERVISOR_ENABLED:false}
    hedge-planner-enabled: ${HTX_CONTRACT_HEDGE_PLANNER_ENABLED:true}
    hedge-ratio: ${HTX_CONTRACT_HEDGE_RATIO:0.5}
    hedge-max-short-base: ${HTX_CONTRACT_HEDGE_MAX_SHORT_BASE:0.05}
    hedge-minimum-margin-available: ${HTX_CONTRACT_HEDGE_MINIMUM_MARGIN_AVAILABLE:10}
    hedge-max-abs-funding-rate: ${HTX_CONTRACT_HEDGE_MAX_ABS_FUNDING_RATE:0.0010} # <=0 跳过资金费率 gate
    hedge-max-basis-rate: ${HTX_CONTRACT_HEDGE_MAX_BASIS_RATE:0.0020}             # <=0 跳过现货/合约基差 gate
    hedge-minimum-liquidation-distance-rate: ${HTX_CONTRACT_HEDGE_MINIMUM_LIQUIDATION_DISTANCE_RATE:0.1000}
    hedge-supervisor-shadow-only: ${HTX_CONTRACT_HEDGE_SUPERVISOR_SHADOW_ONLY:true}
    # Future live-send gate. Requires shadow-only=false plus dry-run=false plus live-enabled=true.
    hedge-auto-send-enabled: ${HTX_CONTRACT_HEDGE_AUTO_SEND_ENABLED:false}
    hedge-supervisor-initial-delay-ms: ${HTX_CONTRACT_HEDGE_SUPERVISOR_INITIAL_DELAY_MS:30000}
    hedge-supervisor-interval-ms: ${HTX_CONTRACT_HEDGE_SUPERVISOR_INTERVAL_MS:60000}
    hedge-supervisor-batch-size: ${HTX_CONTRACT_HEDGE_SUPERVISOR_BATCH_SIZE:20}
    # 自动往返默认仅用于 dry-run；实盘还必须显式打开 auto-live-enabled。
    auto-test-enabled: ${HTX_CONTRACT_AUTO_TEST_ENABLED:false}
    auto-live-enabled: ${HTX_CONTRACT_AUTO_LIVE_ENABLED:false}
    auto-test-initial-delay-ms: ${HTX_CONTRACT_AUTO_TEST_INITIAL_DELAY_MS:20000}
    auto-test-interval-ms: ${HTX_CONTRACT_AUTO_TEST_INTERVAL_MS:5000}
    auto-test-volume: ${HTX_CONTRACT_AUTO_TEST_VOLUME:2}
    auto-test-quote-notional: ${HTX_CONTRACT_AUTO_TEST_QUOTE_NOTIONAL:20}
    auto-fast-ioc-enabled: ${HTX_CONTRACT_AUTO_FAST_IOC_ENABLED:false}
    auto-profit-grid-enabled: ${HTX_CONTRACT_AUTO_PROFIT_GRID_ENABLED:true}
    maker-fee-rate-per-side: ${HTX_CONTRACT_MAKER_FEE_RATE_PER_SIDE:0.0004}
    min-net-profit-rate: ${HTX_CONTRACT_MIN_NET_PROFIT_RATE:0.0010}
    funding-buffer-rate: ${HTX_CONTRACT_FUNDING_BUFFER_RATE:0.0002}
    safety-buffer-rate: ${HTX_CONTRACT_SAFETY_BUFFER_RATE:0.0005}
    max-entry-spread-rate: ${HTX_CONTRACT_MAX_ENTRY_SPREAD_RATE:0.0010}
    profit-grid-exit-ttl-ms: ${HTX_CONTRACT_PROFIT_GRID_EXIT_TTL_MS:3600000}
    max-emergency-slippage-rate: ${HTX_CONTRACT_MAX_EMERGENCY_SLIPPAGE_RATE:0.0010}
    max-daily-realized-loss-usdt: ${HTX_CONTRACT_MAX_DAILY_REALIZED_LOSS_USDT:1.0}
    max-consecutive-losses: ${HTX_CONTRACT_MAX_CONSECUTIVE_LOSSES:3}
    fast-ioc-close-retry-attempts: ${HTX_CONTRACT_FAST_IOC_CLOSE_RETRY_ATTEMPTS:3}
    insufficient-margin-backoff-ms: ${HTX_CONTRACT_INSUFFICIENT_MARGIN_BACKOFF_MS:300000}
    auto-test-target-return-pct: ${HTX_CONTRACT_AUTO_TEST_TARGET_RETURN_PCT:0.006}

