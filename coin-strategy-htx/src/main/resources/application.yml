    funding-carry-min-atr-pct: ${HTX_TREND_FUNDING_CARRY_MIN_ATR_PCT:0.0010}
    funding-carry-require-confirmation: ${HTX_TREND_FUNDING_CARRY_REQUIRE_CONFIRMATION:true}
    funding-carry-allow-against-broad-market: ${HTX_TREND_FUNDING_CARRY_ALLOW_AGAINST_BROAD_MARKET:false}
    max-hold-funding-cost-rate: ${HTX_TREND_MAX_HOLD_FUNDING_COST_RATE:0.0012}
    leverage: ${HTX_TREND_LEVERAGE:5}
    price-scale: ${HTX_TREND_PRICE_SCALE:2}
    min-contract-margin-available: ${HTX_TREND_MIN_CONTRACT_MARGIN_AVAILABLE:20}
    poll-interval-ms: ${HTX_TREND_POLL_INTERVAL_MS:60000}
    initial-delay-ms: ${HTX_TREND_INITIAL_DELAY_MS:30000}
    cooldown-ms: ${HTX_TREND_COOLDOWN_MS:3600000}
    loss-cooldown-ms: ${HTX_TREND_LOSS_COOLDOWN_MS:3600000}
