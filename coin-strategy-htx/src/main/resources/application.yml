server:
  port: 8082
  address: ${HTX_SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: /htx/api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: off
  datasource:
    url: "jdbc:mysql://${HTX_DB_HOST:127.0.0.1}:${HTX_DB_PORT:3306}/htx_trade_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true"
    username: "${HTX_DB_USERNAME:root}"
    password: "${HTX_DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  config: classpath:logback-spring.xml

htx:
  api:
    # Set via HTX_ACCESS_KEY / HTX_SECRET_KEY env vars. Empty -> HtxConfig not wired,
    # controller is not mounted, service refuses to start with a clear "no HtxApiService bean" error.
    access-key: "${HTX_ACCESS_KEY:}"
    secret-key: "${HTX_SECRET_KEY:}"
    base-url: "${HTX_BASE_URL:https://api.huobi.pro}"
    ws-url: "${HTX_WS_URL:wss://api.huobi.pro/ws}"
    # First-run: leave blank, call GET /htx/api/htx/accounts, write the returned id back here.
    spot-account-id: "${HTX_SPOT_ACCOUNT_ID:}"
  trade:
    # DEFAULT dry-run. Flip to true only after AK/SK/spotAccountId are verified.
    enabled: ${HTX_TRADE_ENABLED:false}
    fill-poll-interval-ms: 200
    fill-timeout-ms: 5000
    require-spot-account-id-when-enabled: true
  depth-guard:
    top-n: 10
    safety-ratio: 3.0
    min-quote-notional: 20
  risk:
    # 交易额度上限（quote/USDT 名义）。权威值在此配置文件，环境变量可覆盖。
    # 单笔上限：买/卖两腿较大者不得超过此值。<=0 表示不限制。
    max-single-quote-notional: ${HTX_MAX_SINGLE_QUOTE_NOTIONAL:50}
    # 当日累计上限：当日非 dry-run 已提交买腿名义之和 + 本单买腿名义不得超过此值。<=0 表示不限制。
    max-daily-quote-notional: ${HTX_MAX_DAILY_QUOTE_NOTIONAL:100000}
  reconciler:
    enabled: true
    interval-ms: 30000
    max-flatten-retries: 3
  market-maker:
    # 自主做市策略。总开关默认关（急停=false 重启则调度器 bean 不加载，已挂单冻结靠 TTL/人工）。
    # 权威值在此配置文件，env 可覆盖；Java 端仅兜底默认。见 spec 2026-08-06-htx-market-maker-design.md §5。
    enabled: ${HTX_MM_ENABLED:false}
    symbols: ${HTX_MM_SYMBOLS:xautusdt} # 仅开黄金；历史 BTC/ETH open cell 仍由状态机推进至退出
    poll-interval-ms: ${HTX_MM_POLL_INTERVAL_MS:10000}
    spread-pct: ${HTX_MM_SPREAD_PCT:0.003}              # δ=0.3%（买腿贴 bestBid，sell=buy·(1+2δ)）
    fee-rate-per-side: ${HTX_MM_FEE_RATE_PER_SIDE:0.002} # HTX 账户费率接口失败时使用的保守回退值
    per-cell-quote-notional: ${HTX_MM_PER_CELL_QUOTE_NOTIONAL:12}  # 应 < risk.max-single-quote-notional(50)
    min-sell-order-quote-notional: ${HTX_MM_MIN_SELL_ORDER_QUOTE_NOTIONAL:1.1} # 低于 HTX 最低名义的残量转 MM_DUST，停止无效重试
    max-concurrent-cells-per-symbol: ${HTX_MM_MAX_CELLS:20}        # K：单标的最大并行 open cell
    min-gap-pct: ${HTX_MM_MIN_GAP_PCT:0.0009}          # 略低于 0.1% 网格步长，兼顾价格舍入与同价去重
    buy-ttl-ms: ${HTX_MM_BUY_TTL_MS:900000}            # 买单 15min 兜底 TTL（跟价为主）
    reprice-threshold-pct: ${HTX_MM_REPRICE_THRESHOLD_PCT:0.001}  # 买价漂移≥0.1%即撤旧单在新bestBid重挂
    insufficient-balance-backoff-ms: ${HTX_MM_INSUFFICIENT_BALANCE_BACKOFF_MS:300000} # USDT不足后5min只查恢复，不重复下单
    sell-ttl-ms: ${HTX_MM_SELL_TTL_MS:0}               # 0=卖单不设 TTL，一直挂到成交
    sell-follow-enabled: ${HTX_MM_SELL_FOLLOW_ENABLED:true}   # 卖腿跟价+止损总开关；false=退回旧固定价挂到成交
    stop-loss-enabled: ${HTX_MM_STOP_LOSS_ENABLED:false}      # 保本模式默认禁止低于成本的市价止损
    stop-loss-pct: ${HTX_MM_STOP_LOSS_PCT:0.005}             # 跌破 buy·(1−此值) 触发 taker 割肉
    sell-reprice-threshold-pct: ${HTX_MM_SELL_REPRICE_THRESHOLD_PCT:0.001}  # 卖价漂移超此比例才重挂
    sell-linger-exit-enabled: ${HTX_MM_SELL_LINGER_EXIT_ENABLED:false}
    sell-linger-timeout-ms: ${HTX_MM_SELL_LINGER_TIMEOUT_MS:120000}
    sell-linger-loss-tolerance-pct: ${HTX_MM_SELL_LINGER_LOSS_TOLERANCE_PCT:0.002}
    buy-taker-escalation-enabled: ${HTX_MM_BUY_TAKER_ESCALATION_ENABLED:true}   # 买腿超时穿价 taker 入场总开关；false=退回现状撤单重开
    buy-taker-max-cross-pct: ${HTX_MM_BUY_TAKER_MAX_CROSS_PCT:0.001}            # 价差闸门：ask≤bid·(1+此值) 才吃单（btc/eth 可吃、xautusdt 被挡）
    buy-cancel-retry-cooldown-ms: ${HTX_MM_BUY_CANCEL_RETRY_COOLDOWN_MS:300000} # 零成交买单被取消后，同价/近价位暂停重开，防止 post-only 撤挂风暴
    grid-mode-enabled: ${HTX_MM_GRID_MODE_ENABLED:false}
    grid-sell-follow-window-enabled: ${HTX_MM_GRID_SELL_FOLLOW_WINDOW_ENABLED:false} # 网格库存卖腿跟随当前窗口/盘口，浮亏风险由合约对冲承接
    grid-step-pct: ${HTX_MM_GRID_STEP_PCT:0.001}
    grid-levels: ${HTX_MM_GRID_LEVELS:20}
    grid-migration-hysteresis-pct: ${HTX_MM_GRID_MIGRATION_HYSTERESIS_PCT:0.0005}
    grid-migration-confirmations: ${HTX_MM_GRID_MIGRATION_CONFIRMATIONS:2}
    grid-migration-cooldown-ms: ${HTX_MM_GRID_MIGRATION_COOLDOWN_MS:30000}
    grid-max-shift-steps-per-tick: ${HTX_MM_GRID_MAX_SHIFT_STEPS_PER_TICK:20}
    grid-floor-price: ${HTX_MM_GRID_FLOOR_PRICE:0}
    max-total-exposure-quote-notional: ${HTX_MM_MAX_TOTAL_EXPOSURE_QUOTE_NOTIONAL:240}
    min-quote-reserve: ${HTX_MM_MIN_QUOTE_RESERVE:0}
    max-base-inventory: ${HTX_MM_MAX_BASE_INVENTORY:0}
    daily-net-loss-budget: ${HTX_MM_DAILY_NET_LOSS_BUDGET:5}
    max-consecutive-loss-cycles: ${HTX_MM_MAX_CONSECUTIVE_LOSS_CYCLES:3}

  funding-arbitrage:
    enabled: ${HTX_FUNDING_ARB_ENABLED:false}
    entry-enabled: ${HTX_FUNDING_ARB_ENTRY_ENABLED:true}
    symbol: ${HTX_FUNDING_ARB_SYMBOL:xautusdt}
    contract-code: ${HTX_FUNDING_ARB_CONTRACT:XAUT-USDT}
    target-quote-notional: ${HTX_FUNDING_ARB_TARGET_NOTIONAL:500}
    min-funding-rate: ${HTX_FUNDING_ARB_MIN_FUNDING_RATE:0.00005}
    exit-funding-rate: ${HTX_FUNDING_ARB_EXIT_FUNDING_RATE:0}
    max-entry-basis-rate: ${HTX_FUNDING_ARB_MAX_ENTRY_BASIS_RATE:0.0015}
    max-hold-basis-rate: ${HTX_FUNDING_ARB_MAX_HOLD_BASIS_RATE:0.0030}
    min-liquidation-distance-rate: ${HTX_FUNDING_ARB_MIN_LIQUIDATION_DISTANCE_RATE:0.0500}
    spot-entry-slippage-rate: ${HTX_FUNDING_ARB_SPOT_ENTRY_SLIPPAGE_RATE:0.0005}
    spot-exit-slippage-rate: ${HTX_FUNDING_ARB_SPOT_EXIT_SLIPPAGE_RATE:0.0010}
    price-scale: ${HTX_FUNDING_ARB_PRICE_SCALE:2}
    base-scale: ${HTX_FUNDING_ARB_BASE_SCALE:6}
    spot-entry-ttl-ms: ${HTX_FUNDING_ARB_SPOT_ENTRY_TTL_MS:60000}
    spot-exit-ttl-ms: ${HTX_FUNDING_ARB_SPOT_EXIT_TTL_MS:60000}
    poll-interval-ms: ${HTX_FUNDING_ARB_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${HTX_FUNDING_ARB_INITIAL_DELAY_MS:20000}
    leverage: ${HTX_FUNDING_ARB_LEVERAGE:5}
    min-contract-volume: ${HTX_FUNDING_ARB_MIN_CONTRACT_VOLUME:1}
    min-spot-quote-available: ${HTX_FUNDING_ARB_MIN_SPOT_QUOTE_AVAILABLE:20}
    min-contract-margin-available: ${HTX_FUNDING_ARB_MIN_CONTRACT_MARGIN_AVAILABLE:20}
    min-spot-quote-reserve: ${HTX_FUNDING_ARB_MIN_SPOT_QUOTE_RESERVE:0}
    client-order-id-prefix: ${HTX_FUNDING_ARB_CLIENT_ORDER_ID_PREFIX:CSFA}
  trend:
    enabled: ${HTX_TREND_ENABLED:false}
    observe-only: ${HTX_TREND_OBSERVE_ONLY:true}
    entry-enabled: ${HTX_TREND_ENTRY_ENABLED:true}
    combination-entry-enabled: ${HTX_TREND_COMBINATION_ENTRY_ENABLED:false}
    contract-code: ${HTX_TREND_CONTRACT:XAUT-USDT}
    contract-codes: ${HTX_TREND_CONTRACTS:BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT,BNB-USDT,DOGE-USDT,ADA-USDT,TRX-USDT,LINK-USDT,AVAX-USDT,SUI-USDT,HYPE-USDT,HBAR-USDT,PONS-USDT,BCH-USDT,LTC-USDT,DOT-USDT,UNI-USDT,AAVE-USDT,NEAR-USDT,ETC-USDT,XLM-USDT,FIL-USDT,ARB-USDT,OP-USDT,ATOM-USDT,ICP-USDT,APT-USDT,PEPE-USDT,SHIB-USDT,WIF-USDT,BONK-USDT,FLOKI-USDT,TAO-USDT,WLD-USDT,TIA-USDT,JUP-USDT,ENA-USDT,ONDO-USDT,ALGO-USDT,OKB-USDT,DASH-USDT,ZEC-USDT,XAUT-USDT,PAXG-USDT,PEOPLE-USDT,ORDI-USDT,BOME-USDT,RAY-USDT,CHZ-USDT,ETHFI-USDT,ACE-USDT}
    max-active-positions: ${HTX_TREND_MAX_ACTIVE_POSITIONS:1}
    period: ${HTX_TREND_PERIOD:15min}
    trend-period: ${HTX_TREND_TREND_PERIOD:60min}
    kline-size: ${HTX_TREND_KLINE_SIZE:160}
    trend-kline-size: ${HTX_TREND_TREND_KLINE_SIZE:160}
    candle-close-grace-seconds: ${HTX_TREND_CANDLE_CLOSE_GRACE_SECONDS:10}
    fast-ema-period: ${HTX_TREND_FAST_EMA_PERIOD:12}
    slow-ema-period: ${HTX_TREND_SLOW_EMA_PERIOD:48}
    trend-fast-ema-period: ${HTX_TREND_TREND_FAST_EMA_PERIOD:8}
    trend-slow-ema-period: ${HTX_TREND_TREND_SLOW_EMA_PERIOD:21}
    breakout-lookback: ${HTX_TREND_BREAKOUT_LOOKBACK:20}
    atr-period: ${HTX_TREND_ATR_PERIOD:14}
    adx-period: ${HTX_TREND_ADX_PERIOD:14}
    min-adx: ${HTX_TREND_MIN_ADX:18}
    min-atr-pct: ${HTX_TREND_MIN_ATR_PCT:0.0010}
    fibonacci-pullback-enabled: ${HTX_TREND_FIBONACCI_PULLBACK_ENABLED:true}
    fibonacci-lower-rate: ${HTX_TREND_FIBONACCI_LOWER_RATE:0.382}
    fibonacci-upper-rate: ${HTX_TREND_FIBONACCI_UPPER_RATE:0.618}
    fibonacci-min-range-atr-multiplier: ${HTX_TREND_FIBONACCI_MIN_RANGE_ATR_MULTIPLIER:1.2}
    max-entry-spread-rate: ${HTX_TREND_MAX_ENTRY_SPREAD_RATE:0.0010}
    liquidity-lookback-bars: ${HTX_TREND_LIQUIDITY_LOOKBACK_BARS:20}
    min-entry-avg-turnover-usdt: ${HTX_TREND_MIN_ENTRY_AVG_TURNOVER_USDT:0}
    entry-depth-levels: ${HTX_TREND_ENTRY_DEPTH_LEVELS:5}
    min-entry-depth-multiplier: ${HTX_TREND_MIN_ENTRY_DEPTH_MULTIPLIER:3}
    max-entry-atr-pct: ${HTX_TREND_MAX_ENTRY_ATR_PCT:0.0500}
    target-quote-notional: ${HTX_TREND_TARGET_QUOTE_NOTIONAL:220}
    max-quote-notional: ${HTX_TREND_MAX_QUOTE_NOTIONAL:350}
    min-quote-notional: ${HTX_TREND_MIN_QUOTE_NOTIONAL:20}
    risk-per-trade-usdt: ${HTX_TREND_RISK_PER_TRADE_USDT:2.0}
    atr-stop-multiplier: ${HTX_TREND_ATR_STOP_MULTIPLIER:2.5}
    trailing-atr-multiplier: ${HTX_TREND_TRAILING_ATR_MULTIPLIER:2.0}
    take-profit-atr-multiplier: ${HTX_TREND_TAKE_PROFIT_ATR_MULTIPLIER:0}
    estimated-taker-fee-rate: ${HTX_TREND_ESTIMATED_TAKER_FEE_RATE:0.0004}
    fee-rate-cache-ms: ${HTX_TREND_FEE_RATE_CACHE_MS:600000}
    min-net-profit-rate: ${HTX_TREND_MIN_NET_PROFIT_RATE:0.0010}
    direction-confidence-gate-enabled: ${HTX_TREND_DIRECTION_CONFIDENCE_GATE_ENABLED:true}
    min-direction-confidence-score: ${HTX_TREND_MIN_DIRECTION_CONFIDENCE_SCORE:70}
    min-mixed-direction-confidence-score: ${HTX_TREND_MIN_MIXED_DIRECTION_CONFIDENCE_SCORE:82}
    min-counter-breadth-direction-confidence-score: ${HTX_TREND_MIN_COUNTER_BREADTH_DIRECTION_CONFIDENCE_SCORE:95}
    fibonacci-min-direction-confidence-score: ${HTX_TREND_FIBONACCI_MIN_DIRECTION_CONFIDENCE_SCORE:80}
    funding-carry-min-direction-confidence-score: ${HTX_TREND_FUNDING_CARRY_MIN_DIRECTION_CONFIDENCE_SCORE:90}
    ensemble-entry-enabled: ${HTX_TREND_ENSEMBLE_ENTRY_ENABLED:true}
    ensemble-entry-min-score: ${HTX_TREND_ENSEMBLE_ENTRY_MIN_SCORE:85}
    ensemble-entry-min-score-gap: ${HTX_TREND_ENSEMBLE_ENTRY_MIN_SCORE_GAP:20}
    ensemble-entry-min-adx: ${HTX_TREND_ENSEMBLE_ENTRY_MIN_ADX:24}
    ensemble-entry-min-atr-pct: ${HTX_TREND_ENSEMBLE_ENTRY_MIN_ATR_PCT:0.0012}
    ensemble-entry-require-trending-regime: ${HTX_TREND_ENSEMBLE_ENTRY_REQUIRE_TRENDING_REGIME:true}
    ensemble-entry-require-breadth-alignment: ${HTX_TREND_ENSEMBLE_ENTRY_REQUIRE_BREADTH_ALIGNMENT:false}
    ensemble-entry-allow-against-broad-market: ${HTX_TREND_ENSEMBLE_ENTRY_ALLOW_AGAINST_BROAD_MARKET:false}
    min-flat-exit-profit-usdt: ${HTX_TREND_MIN_FLAT_EXIT_PROFIT_USDT:0.20}
    flat-exit-confirmation-bars: ${HTX_TREND_FLAT_EXIT_CONFIRMATION_BARS:3}
    max-flat-exit-loss-usdt: ${HTX_TREND_MAX_FLAT_EXIT_LOSS_USDT:0.25}
    max-flat-exit-loss-rate: ${HTX_TREND_MAX_FLAT_EXIT_LOSS_RATE:0.0030}
    flat-loss-exit-confirmation-bars: ${HTX_TREND_FLAT_LOSS_EXIT_CONFIRMATION_BARS:3}
    no-extension-exit-enabled: ${HTX_TREND_NO_EXTENSION_EXIT_ENABLED:true}
    no-extension-exit-bars: ${HTX_TREND_NO_EXTENSION_EXIT_BARS:2}
    no-extension-min-favorable-net-usdt: ${HTX_TREND_NO_EXTENSION_MIN_FAVORABLE_NET_USDT:0.15}
    adverse-shock-exit-enabled: ${HTX_TREND_ADVERSE_SHOCK_EXIT_ENABLED:true}
    adverse-shock-exit-bars: ${HTX_TREND_ADVERSE_SHOCK_EXIT_BARS:1}
    adverse-shock-atr-multiplier: ${HTX_TREND_ADVERSE_SHOCK_ATR_MULTIPLIER:0.90}
    adverse-shock-min-favorable-net-usdt: ${HTX_TREND_ADVERSE_SHOCK_MIN_FAVORABLE_NET_USDT:0.15}
    min-expected-move-atr-multiplier: ${HTX_TREND_MIN_EXPECTED_MOVE_ATR_MULTIPLIER:1.0}
    max-entry-signal-chase-atr-multiplier: ${HTX_TREND_MAX_ENTRY_SIGNAL_CHASE_ATR_MULTIPLIER:0.20}
    max-entry-signal-chase-rate: ${HTX_TREND_MAX_ENTRY_SIGNAL_CHASE_RATE:0}
    max-entry-signal-age-seconds: ${HTX_TREND_MAX_ENTRY_SIGNAL_AGE_SECONDS:600}
    candidate-scan-concurrency: ${HTX_TREND_CANDIDATE_SCAN_CONCURRENCY:6}
    adaptive-sizing-enabled: ${HTX_TREND_ADAPTIVE_SIZING_ENABLED:true}
