    quality-strong-profit-factor: ${HTX_TREND_QUALITY_STRONG_PROFIT_FACTOR:1.30}
    weak-quality-position-multiplier: ${HTX_TREND_WEAK_QUALITY_POSITION_MULTIPLIER:0.50}
    strong-quality-position-multiplier: ${HTX_TREND_STRONG_QUALITY_POSITION_MULTIPLIER:1.15}
    market-breadth-lookback-minutes: ${HTX_TREND_MARKET_BREADTH_LOOKBACK_MINUTES:35}
