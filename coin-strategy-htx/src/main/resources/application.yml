server:
  port: 8082
  address: ${HTX_SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: /htx/api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: off
  datasource:
    url: "jdbc:mysql://${HTX_DB_HOST:127.0.0.1}:${HTX_DB_PORT:3306}/htx_trade_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true"
    username: "${HTX_DB_USERNAME:root}"
    password: "${HTX_DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  config: classpath:logback-spring.xml

htx:
  api:
    # Set via HTX_ACCESS_KEY / HTX_SECRET_KEY env vars. Empty -> HtxConfig not wired,
    # controller is not mounted, service refuses to start with a clear "no HtxApiService bean" error.
    access-key: "${HTX_ACCESS_KEY:}"
    secret-key: "${HTX_SECRET_KEY:}"
    base-url: "https://api.huobi.pro"
    ws-url: "wss://api.huobi.pro/ws"
    # First-run: leave blank, call GET /htx/api/htx/accounts, write the returned id back here.
    spot-account-id: "${HTX_SPOT_ACCOUNT_ID:}"
  trade:
    # DEFAULT dry-run. Flip to true only after AK/SK/spotAccountId are verified.
    enabled: ${HTX_TRADE_ENABLED:false}
    fill-poll-interval-ms: 200
    fill-timeout-ms: 5000
    require-spot-account-id-when-enabled: true
  depth-guard:
    top-n: 10
    safety-ratio: 3.0
    min-quote-notional: 20
  risk:
    # 交易额度上限（quote/USDT 名义）。权威值在此配置文件，环境变量可覆盖。
    # 单笔上限：买/卖两腿较大者不得超过此值。<=0 表示不限制。
    max-single-quote-notional: ${HTX_MAX_SINGLE_QUOTE_NOTIONAL:50}
    # 当日累计上限：当日非 dry-run 已提交买腿名义之和 + 本单买腿名义不得超过此值。<=0 表示不限制。
    max-daily-quote-notional: ${HTX_MAX_DAILY_QUOTE_NOTIONAL:100000}
  reconciler:
    enabled: true
    interval-ms: 30000
    max-flatten-retries: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
