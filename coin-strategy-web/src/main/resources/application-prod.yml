# ============================================================
# coin-strategy-web — PROD 生产环境
# 说明: 默认 web 和 job 同机部署，web 对外、job 仅内网监听
# ============================================================
dashboard:
  job-base-url: ${DASHBOARD_JOB_BASE_URL:http://127.0.0.1:8081}

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:3306/coin_strategy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
