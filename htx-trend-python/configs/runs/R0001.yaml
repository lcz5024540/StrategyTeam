# R0001 - 基线运行配置
run_id: R0001
parent_run_id: null

# 账户配置（生产环境必需）
account:
  account_id: "MAIN"  # HTX MAIN 账户 ID（生产环境填写实际 ID）
  account_type: "MAIN"  # 只允许 MAIN
  margin_mode: "cross"  # 只允许 cross
  # 注：子账户下单将被拒绝

# 实验登记
registration:
  change: "Initial baseline with C01 Donchian + C02 ATR stop"
  hypothesis: "Donchian ensemble (4h 42/84/126/168) combined with ATR14x2 stop can capture medium-term trends in BTC/ETH"
  expected_effect: "Establish baseline performance metrics"
  keep_rule: "Sample size ≥30, PF ≥1.3, positive net expectation"
  drop_rule: "Sample size <30 or PF <1.0 or negative expectation"
  evidence_ref: "trend-strategy-prd-v0.1.md § 4"

# 数据集
dataset_id: "4hour_placeholder"  # 将在实际运行时替换
symbols:
  - BTC-USDT
  - ETH-USDT
split: train  # train / validation / test
stage_acceptance: false  # 测试集锁，仅验收时true

# 回测参数
initial_equity: 400.0  # 初始资金 400 USDT（真实账户起始资金）
cost_scenario: base  # zero / optimistic / base / conservative

# 费率配置（可选）
fees:
  use_authenticated: false  # true 需要 API key
  # maker_rate: 0.0002  # 如不指定，按 cost_scenario 默认
  # taker_rate: 0.0006
  # 注：base scenario 默认为 maker 0.02% / taker 0.06%
  # 真实费率来源将在报告中标注

# 风险管理
risk_per_trade: 0.005  # 0.5%
max_total_risk: 0.015  # 1.5%
max_positions: 3

# 条件配置
conditions:
  C01:
    enabled: true
    periods: [42, 84, 126, 168]
    threshold: 0.25
  
  C02:
    enabled: true
    atr_period: 14
    atr_multiplier: 2.0

# 其他
leverage_target: 5.0
