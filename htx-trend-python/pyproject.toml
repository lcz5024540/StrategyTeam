[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinstrategy-htx-trend"
version = "0.1.0"
description = "HTX USDT perpetual trend strategy runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=14,<16",
    "PyMySQL>=1.1,<2",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
cos = ["cos-python-sdk-v5>=1.9,<2"]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
htx-trend = "htx_trend.cli:main"
htx-cos-archive = "htx_trend.archive.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
