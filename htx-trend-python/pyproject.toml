[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinstrategy-htx-trend"
version = "0.1.1-rc.1"  # Keep in sync with src/htx_trend/research/_version.py
description = "HTX USDT perpetual trend strategy runtime"
dynamic = []
readme = "README.md"
requires-python = ">=3.11"
# Runtime imports audited from src/: httpx, pandas, numpy, pyarrow (parquet),
# PyYAML, PyMySQL, cryptography. Do not add workstation/apt packages here.
dependencies = [
    "httpx>=0.27,<1",
    "PyMySQL>=1.1,<2",
    "cryptography>=43,<47",
    "pandas>=2.0,<3",
    "numpy>=1.24,<2",
    "pyarrow>=14.0,<18",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
htx-trend = "htx_trend.cli:main"
htx-trend-research = "htx_trend.research.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "require_runtime_integrity: exercise PACKAGE_MANIFEST / git-tree checks",
]

[tool.setuptools.packages.find]
where = ["src"]
