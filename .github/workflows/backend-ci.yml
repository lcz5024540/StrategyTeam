# Generated from ray-agent docs/skills/setup-cicd/templates/backend-ci.yml (2026-05-27)
# 填充参数：
#   <PROJECT_NAME>   = coinstrategy
#   <JAVA_VERSION>   = 17
#   <MAIN_BRANCH>    = main
# 如需调整，**修改 source template 与本文件保持同步**——见 docs/skills/setup-cicd/SKILL.md §6 注意事项。

name: Backend CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "coin-strategy-frontend/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "coin-strategy-frontend/**"
      - "docs/**"
      - "**.md"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Maven Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Display effective Maven settings
        run: mvn -B -version

      - name: Compile (all modules)
        run: mvn -B -ntp clean compile

      - name: Run tests
        run: mvn -B -ntp verify -DskipITs=false

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

      - name: Upload jars
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coinstrategy-jars
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/original-*.jar
          retention-days: 14
