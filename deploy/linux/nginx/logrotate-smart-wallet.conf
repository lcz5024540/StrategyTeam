# ============================================================
# Nginx 日志按天轮转配置
# 部署: 将此文件复制到 /etc/logrotate.d/smart-wallet
# ============================================================
/opt/coinstrategy/smart-wallet/logs/nginx-access.log
/opt/coinstrategy/smart-wallet/logs/nginx-error.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    dateext
    dateformat -%Y-%m-%d
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) || true
    endscript
}
