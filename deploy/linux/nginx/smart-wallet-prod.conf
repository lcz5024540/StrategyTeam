# ============================================================
# PROD 生产环境 nginx 配置 — 前后端分离部署
# 此配置部署在【前端服务器】上
# 部署步骤:
#   1. 将 __FRONTEND_SERVER_IP__ 替换为前端服务器的域名或 IP
#   2. 将 __BACKEND_SERVER_IP__ 替换为后端服务器的 IP
#   3. 将此文件复制到 /etc/nginx/conf.d/smart-wallet.conf
#   4. 将 frontend/dist 复制到 /opt/coinstrategy/smart-wallet/frontend/dist
#   5. nginx -t && systemctl reload nginx
# ============================================================
server {
    listen 80;
    server_name __FRONTEND_SERVER_IP__;

    root /opt/coinstrategy/smart-wallet/frontend/dist;
    index index.html;
    server_tokens off;

    # API 反向代理 — 后端在另一台服务器上
    location /strategy/api/ {
        proxy_pass http://__BACKEND_SERVER_IP__:8081/strategy/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # 隐藏文件禁止访问
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
