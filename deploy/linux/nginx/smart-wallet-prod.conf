# ============================================================
# PROD 生产环境 nginx 配置（暂未上线，仅模板）
#
# Prod 环境暂时取消。恢复时需要决策:
#   1. server_name 用哪个域名/IP（与 test 同机时不能都用 43.139.186.27 同端口）
#   2. proxy_pass 端口（test 用 8080，prod 可以用 8082）
#   3. listen 端口（test 用 80，prod 可以另起 81 或独立机器）
# ============================================================

log_format smart_wallet_fmt '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time';

server {
    listen 80;
    server_name __SERVER_IP__;

    access_log /opt/coinstrategy/smart-wallet/logs/nginx-access.log smart_wallet_fmt;
    error_log  /opt/coinstrategy/smart-wallet/logs/nginx-error.log warn;

    root /opt/coinstrategy/smart-wallet/frontend/dist;
    index index.html;
    server_tokens off;

    location /strategy/api/ {
        proxy_pass http://127.0.0.1:8080/strategy/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
