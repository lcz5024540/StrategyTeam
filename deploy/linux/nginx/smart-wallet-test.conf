# ============================================================
# TEST 测试环境 nginx 配置 — 前后端同机部署 (49.51.250.174)
# 部署步骤:
#   1. 将此文件复制到 /etc/nginx/conf.d/smart-wallet.conf
#   2. 将 frontend/dist 复制到 /opt/coinstrategy/smart-wallet/frontend/dist
#   3. mkdir -p /opt/coinstrategy/smart-wallet/logs
#   4. nginx -t && systemctl reload nginx
# ============================================================

# 按天切割日志格式
log_format smart_wallet_fmt '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time';

server {
    listen 80;
    server_name 49.51.250.174;

    # 访问日志 — 按天由 logrotate 管理, 或使用 $time_iso8601 变量切割
    access_log /opt/coinstrategy/smart-wallet/logs/nginx-access.log smart_wallet_fmt;
    error_log  /opt/coinstrategy/smart-wallet/logs/nginx-error.log warn;

    root /opt/coinstrategy/smart-wallet/frontend/dist;
    index index.html;
    server_tokens off;

    # API 反向代理 — 统一先到 web，再由 web 内转发到 job
    location /strategy/api/ {
        proxy_pass http://127.0.0.1:8080/strategy/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # 隐藏文件禁止访问
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
